# GPT-6-Luna Fast Medium для интервью. Меньше инструментов — быстрее ответы.
model = "gpt-6-luna"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "medium"
service_tier = "fast"
model_verbosity = "low"
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "disabled"

[features]
fast_mode = true
hooks = true
apps = false
browser_use = false
computer_use = false
goals = false
image_generation = false
multi_agent = false
plugins = false
skill_search = false
tool_suggest = false

# Транспорт указан, чтобы конфиг был валиден и на машине без этих серверов в ~/.codex.
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = false

[mcp_servers.playwright]
command = "npx"
enabled = false

[mcp_servers.trello]
url = "https://mcp.trello.com/v1"
enabled = false
