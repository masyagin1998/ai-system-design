[project]
name = "mvp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic",
    "boto3",
    "fastapi",
    "httpx",
    "psycopg[binary]",
    "pydantic-settings",
    "pyjwt",
    "python-multipart",
    "redis",
    "sqlalchemy[asyncio]",
    "tenacity",
    "uvicorn[standard]",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
extend-exclude = ["manual", "tools"]  # tools/ — stdlib-скрипты под системный Python 3.12

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
